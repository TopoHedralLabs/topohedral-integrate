name: CI

on:
  push:
  pull_request:

env:
  CARGO_REGISTRIES_CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_API_KEY }}
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Stable quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenblas-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test without default features
        run: cargo test --no-default-features

      - name: Test Serde feature
        run: cargo test --features serde

      - name: Test trace feature
        run: cargo test --features trace

      - name: Test all features
        run: cargo test --all-targets --all-features

      - name: Test release build
        run: cargo test --release --all-features

      - name: Check rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopenblas-dev

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check library at MSRV
        run: cargo check --lib --no-default-features

  licenses:
    name: Permissive licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny

      - name: Enforce license and source policy
        run: cargo deny check licenses sources
